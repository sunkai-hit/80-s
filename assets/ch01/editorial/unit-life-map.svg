<rect width="1400" height="980" fill="url(#paper)"/>
<rect x="46" y="46" width="1308" height="888" rx="30" fill="#fbf8f1" stroke="#d7cec0" filter="url(#shadow)"/>
<rect x="72" y="72" width="1256" height="836" fill="url(#grid)" opacity=".65"/>
<text x="110" y="148" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="56" font-weight="700" fill="#26231f">一个人的“单位生活半径”</text>
<text x="112" y="192" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" fill="#756c63">工作并不只发生在车间里。对于许多城市职工，生活中很多关键环节都围绕同一个单位展开。</text>
<path d="M145 720 C310 655 380 690 510 633 C650 572 716 592 842 544 C1005 482 1090 518 1248 450" fill="none" stroke="#c3b8aa" stroke-width="36" stroke-linecap="round" opacity=".55"/>
<path d="M145 720 C310 655 380 690 510 633 C650 572 716 592 842 544 C1005 482 1090 518 1248 450" fill="none" stroke="#9a8c7e" stroke-width="3" stroke-dasharray="12 14" opacity=".85"/>
<g transform="translate(150,540)"><rect x="0" y="52" width="244" height="126" rx="8" fill="#7e8a8a"/><rect x="22" y="80" width="200" height="98" fill="#e9e4dc"/><rect x="76" y="16" width="92" height="58" fill="#8d4336"/><text x="122" y="54" text-anchor="middle" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#fff">厂 门</text><path d="M32 116h180M62 80v98M182 80v98" stroke="#7e8a8a" stroke-width="6"/><text x="122" y="220" text-anchor="middle" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#332e29">工作</text></g>
<g transform="translate(420,350)"><polygon points="0,90 168,22 334,90 166,160" fill="#b7c0be"/><polygon points="0,90 0,234 166,306 166,160" fill="#899795"/><polygon points="334,90 334,234 166,306 166,160" fill="#6f7f7e"/><g fill="#dce1de"><rect x="44" y="118" width="52" height="40"/><rect x="116" y="148" width="52" height="40"/><rect x="202" y="118" width="52" height="40"/><rect x="254" y="148" width="42" height="40"/></g><text x="166" y="354" text-anchor="middle" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#332e29">车间</text></g>
<g transform="translate(900,250)"><polygon points="0,104 118,48 246,104 124,160" fill="#d0b59b"/><polygon points="0,104 0,260 124,316 124,160" fill="#b89a80"/><polygon points="246,104 246,260 124,316 124,160" fill="#9c7f69"/><g fill="#f5efe4"><rect x="28" y="134" width="38" height="28"/><rect x="76" y="156" width="38" height="28"/><rect x="154" y="134" width="38" height="28"/><rect x="198" y="156" width="28" height="28"/><rect x="28" y="190" width="38" height="28"/><rect x="76" y="212" width="38" height="28"/><rect x="154" y="190" width="38" height="28"/><rect x="198" y="212" width="28" height="28"/></g><text x="124" y="360" text-anchor="middle" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#332e29">家属院 / 住房</text></g>
<g transform="translate(795,585)"><rect x="0" y="45" width="208" height="106" rx="10" fill="#d8c7a6"/><path d="M-12 45h232l-25-48H16z" fill="#8d4336"/><rect x="28" y="76" width="56" height="42" fill="#f7f0e5"/><rect x="122" y="76" width="56" height="42" fill="#f7f0e5"/><text x="104" y="188" text-anchor="middle" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#332e29">食堂</text></g>
<g transform="translate(1070,600)"><rect x="0" y="22" width="178" height="128" rx="10" fill="#c8d3cf"/><rect x="70" y="48" width="38" height="76" fill="#f8f4ec"/><rect x="52" y="66" width="76" height="38" fill="#f8f4ec"/><text x="89" y="188" text-anchor="middle" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#332e29">医务室</text></g>
<g transform="translate(525,700)"><rect x="0" y="20" width="190" height="112" rx="10" fill="#d7b69e"/><polygon points="-12,20 95,-32 202,20" fill="#a95b49"/><rect x="28" y="54" width="46" height="36" fill="#f7f0e5"/><rect x="116" y="54" width="46" height="36" fill="#f7f0e5"/><circle cx="24" cy="145" r="12" fill="#73897f"/><circle cx="56" cy="152" r="9" fill="#73897f"/><circle cx="151" cy="146" r="13" fill="#73897f"/><text x="95" y="183" text-anchor="middle" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#332e29">幼儿园</text></g>
<g transform="translate(120,248) rotate(-2)"><rect width="250" height="140" rx="14" fill="#fffaf1" stroke="#d5c9ba"/><text x="26" y="43" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" fill="#8d4336" font-weight="700">单位，不只是“上班的地方”</text><text x="26" y="78" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" fill="#5d554d">工资 · 福利 · 住房</text><text x="26" y="106" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="17" fill="#5d554d">医疗 · 托幼 · 退休</text></g>
<g transform="translate(1050,760) rotate(2)"><rect width="230" height="105" rx="12" fill="#efe6d8" stroke="#d2c6b7"/><text x="20" y="36" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="15" fill="#7b7168">不同单位条件差异很大。</text><text x="20" y="64" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="15" fill="#7b7168">图示的是大型国企和事业单位</text><text x="20" y="89" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="15" fill="#7b7168">常见的“单位办社会”逻辑。</text></g>
<text x="112" y="885" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" fill="#7b7168">从厂门到家属院：工作与生活的边界，比今天模糊得多。</text>
</svg>